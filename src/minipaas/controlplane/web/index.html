<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniPaaS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <header class="app-header">
    <a class="brand" href="#/apps">MiniPaaS</a>
    <nav id="main-nav" class="nav" aria-label="Principal" hidden>
      <a href="#/apps" data-nav="apps">Aplicaciones</a>
      <a href="#/status" data-nav="status">Estado del sistema</a>
    </nav>
    <div id="user-area" class="user-area" hidden>
      <span id="user-name" class="user-name"></span>
      <button type="button" id="logout" class="btn-secondary">Cerrar sesión</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">MiniPaaS necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
