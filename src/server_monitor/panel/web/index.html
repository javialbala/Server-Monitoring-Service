<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Server Monitoring Service</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="app-header" class="topbar" hidden>
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="/icons.svg#logo"></use></svg>
        <span class="brand-name">Server Monitoring Service</span>
        <span id="host-name" class="brand-host"></span>
      </div>
      <div class="topbar-status">
        <span id="link-state" class="link-state" data-state="pending">
          <span class="link-dot" aria-hidden="true"></span>
          <span id="link-text">Conectando…</span>
        </span>
        <span id="last-update" class="last-update" role="status">Última actualización —</span>
        <button type="button" id="logout" class="btn btn-ghost">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#log-out"></use></svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <noscript><p class="noscript">Server Monitoring Service necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
