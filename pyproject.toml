[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server-monitoring-service"
version = "0.1.0"
description = "Monitorización ligera de un servidor y de sus contenedores Docker (solo lectura)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# Cada imagen instala solo su extra; el panel no lleva el SDK de Docker.
[project.optional-dependencies]
panel = [
    "httpx>=0.27",
    "argon2-cffi>=25.1",
]
agent = ["docker>=7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/server_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # assert y contraseña de prueba

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere Docker local"]
