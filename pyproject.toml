[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minipaas"
version = "0.1.0"
description = "PaaS ligera sobre Docker: control plane sin privilegios y agente con acceso a Docker."
requires-python = ">=3.12"
# Dependencias comunes a los dos procesos.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",  # sin extra [standard]: más ligero
]

# Cada imagen instala solo su extra: el agente (el componente con acceso a Docker) no lleva
# código que no usa, y el control plane no lleva el SDK de Docker.
[project.optional-dependencies]
controlplane = [
    "httpx>=0.27",          # cliente HTTP hacia el agente
    "argon2-cffi>=25.1",    # hash de contraseñas (ADR-019)
]
agent = ["docker>=7"]

# En desarrollo se instalan ambos extras: `uv sync --all-extras`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minipaas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar en pytest.
# S105/S106: los tokens de los tests son valores falsos de prueba, no contraseñas reales.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere Docker local"]
