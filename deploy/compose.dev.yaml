# Entorno local de desarrollo. Uso (desde la raíz del repositorio):
#   bash scripts/prepare_dev_env.sh
#   docker compose --env-file deploy/.env -f deploy/compose.dev.yaml up -d --build --wait
# Las rutas relativas de este archivo (build, secrets) son relativas a deploy/.
name: minipaas-dev

networks:
  # Sin salida a Internet y sin puertos publicados: solo el panel y el agente se ven aquí.
  minipaas-internal:
    internal: true
  # Red normal, solo para el panel (necesaria para publicar su puerto en localhost).
  minipaas-public:

volumes:
  # Guarda SOLO el hash de la contraseña del panel (/data/password_hash). Persiste a `down`,
  # `restart` y reconstrucciones; solo `docker compose down -v` (o `docker volume rm`) lo borra.
  minipaas-data:

# Un archivo por componente con el MISMO token: cada uno con permisos 600 y propietario el
# UID de su contenedor (Compose ignora uid/gid/mode fuera de Swarm). Ver ADR-014 y
# scripts/prepare_dev_env.sh.
secrets:
  controlplane_token:
    file: ./secrets/controlplane_token
  agent_token:
    file: ./secrets/agent_token

services:
  controlplane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controlplane
    ports:
      - "127.0.0.1:${MINIPAAS_PORT:-8000}:8000"   # solo accesible desde esta máquina
    networks: [minipaas-internal, minipaas-public]
    read_only: true              # sistema de archivos raíz de solo lectura
    tmpfs: [/tmp]                # escribible, en memoria
    volumes:
      - minipaas-data:/data      # hash de la contraseña; único sitio escribible (UID 10001)
    cap_drop: [ALL]              # sin capabilities de Linux
    security_opt: ["no-new-privileges:true"]   # impide ganar privilegios (setuid...)
    secrets: [controlplane_token]
    environment:
      MINIPAAS_AGENT_TOKEN_FILE: /run/secrets/controlplane_token
    labels:
      minipaas.component: controlplane
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - agent
    # SIN socket de Docker: este componente no debe poder controlar el host.

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    # SIN "ports": solo es alcanzable desde la red interna.
    networks: [minipaas-internal]
    volumes:
      # Único componente con acceso al socket de Docker. Equivale a root sobre el host
      # (ver ADR-002): por eso el agente es mínimo, autenticado y su código SOLO consulta
      # (listar contenedores y ping). Montar el socket con :ro no limitaría la API de Docker,
      # así que no se usa: la garantía de solo lectura está en el código del agente (ADR-037).
      - /var/run/docker.sock:/var/run/docker.sock
      # Sistema de archivos raíz del anfitrión, en solo lectura y SIN submontajes
      # (recursive: disabled): /hostfs no incluye /proc, /sys, /home ni otros discos montados.
      # Sirve para medir el disco raíz (statvfs) y leer /etc/os-release y /etc/hostname del
      # anfitrión (ADR-038). El agente no es root: solo puede leer archivos legibles por todos.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          recursive: disabled
    # Permite usar el socket siendo UID 10002 (no root), añadiendo el grupo docker del host.
    group_add: ["${DOCKER_GID:?Define DOCKER_GID en deploy/.env (ver scripts/prepare_dev_env.sh)}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [agent_token]
    environment:
      MINIPAAS_AGENT_TOKEN_FILE: /run/secrets/agent_token
      MINIPAAS_HOSTFS: /hostfs
    labels:
      minipaas.component: agent
